# cancun-rpc.conet.network -> local JSON-RPC (127.0.0.1:8888 on conet.network)
# DNS must resolve cancun-rpc.conet.network to this host (38.102.126.50), not CF-only proxy without origin.
# Deploy: sudo cp scripts/nginx-cancun-rpc-conet.network.conf /etc/nginx/sites-available/cancun-rpc.conet.network.conf
#         sudo ln -sf /etc/nginx/sites-available/cancun-rpc.conet.network.conf /etc/nginx/sites-enabled/
#         sudo certbot certonly --nginx -d cancun-rpc.conet.network  # if cert missing
#         sudo nginx -t && sudo systemctl reload nginx

server {
    server_name cancun-rpc.conet.network;

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        if ($request_method = 'POST') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
        }

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8888;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/cancun-rpc.conet.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cancun-rpc.conet.network/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name cancun-rpc.conet.network;
    return 301 https://$host$request_uri;
}
