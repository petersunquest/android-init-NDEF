# dle.conet.network — CoNET-DLE explorer (static SPA)
# Reverse-proxies archive read APIs to lab TCP 27101.
# Do not proxy excluded IONOS 74.208.224.45 (fd-01 remapped to 45.132.74.220).
# Do not proxy excluded IONOS 198.251.77.98 (fd-03 remapped to 45.132.74.221).
# Do not proxy to shared-beacon host 216.225.197.189.
# Archives do not produce blocks; this is not L1 Blockscout.

upstream dle_lab_archive {
    least_conn;
    server 45.132.74.220:27101 max_fails=2 fail_timeout=8s;
    server 45.132.74.221:27101 max_fails=2 fail_timeout=8s;
    server 167.254.243.38:27101 max_fails=2 fail_timeout=8s;
    server 170.205.39.67:27101 max_fails=2 fail_timeout=8s;
}

server {
    listen 80;
    listen [::]:80;
    server_name dle.conet.network;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/dle.conet.network;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dle.conet.network;

    ssl_certificate /etc/letsencrypt/live/dle.conet.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dle.conet.network/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/dle.conet.network;
    index index.html;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location = /health {
        proxy_pass http://dle_lab_archive;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 4s;
        proxy_read_timeout 8s;
    }

    location = /rpc {
        proxy_pass http://dle_lab_archive;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Connection "";
        proxy_connect_timeout 4s;
        proxy_read_timeout 8s;
    }

    location ^~ /api/v2/dle {
        proxy_pass http://dle_lab_archive;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 4s;
        proxy_read_timeout 8s;
    }

    # Read-only SelectionLog / waiting pool. Do not expose hook / freeze / message POSTs.
    location = /ondemand/pool {
        proxy_pass http://dle_lab_archive;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 4s;
        proxy_read_timeout 8s;
        limit_except GET {
            deny all;
        }
    }

    location = /ondemand/selection {
        proxy_pass http://dle_lab_archive;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 4s;
        proxy_read_timeout 8s;
        limit_except GET {
            deny all;
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
