# Bootstrap only — HTTP so certbot can issue dle.conet.network.
# Replaced by scripts/nginx-dle.conet.network.conf after the certificate exists.

server {
    listen 80;
    listen [::]:80;
    server_name dle.conet.network;

    root /var/www/dle.conet.network;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
