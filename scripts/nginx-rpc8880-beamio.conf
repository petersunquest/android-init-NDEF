# CoNET old-chain read-only RPC: :8880 -> Geth :8882, CORS for beamio.app
# Deploy: scp to /etc/nginx/conf.d/rpc8880-beamio.conf && sudo nginx -t && sudo systemctl reload nginx

map $http_origin $cors_beamio_origin {
    default "";
    "https://beamio.app" $http_origin;
    "https://www.beamio.app" $http_origin;
}

upstream rpc8882_backend {
    server 38.102.126.58:8882;
    keepalive 32;
}

server {
    listen 8880;
    listen [::]:8880;
    server_name _;

    set $cors_allow_headers "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Api-Key,x-csrf-token,X-CSRF-Token,Accept,Accept-Language,Origin,Referer";

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_beamio_origin always;
            add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers $cors_allow_headers always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain; charset=utf-8";
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;

        add_header Access-Control-Allow-Origin $cors_beamio_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers $cors_allow_headers always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Type" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass http://rpc8882_backend;
    }
}
