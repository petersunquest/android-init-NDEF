# rpc-old.conet.network -> old-chain archive Geth :8882 (HTTPS via Cloudflare)
# Deploy: append to /etc/nginx/sites-available/conet.conf && sudo nginx -t && sudo systemctl reload nginx

# rpc-old.conet.network -> Geth JSON-RPC :8882
# CORS: beamio.app（浏览器 HTTPS 页访问）
server {
    listen 80;
    listen [::]:80;
    server_name rpc-old.conet.network;

    set $cors_allow_headers "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Api-Key,x-csrf-token,X-CSRF-Token,Accept,Accept-Language,Origin,Referer";

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers $cors_allow_headers always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain; charset=utf-8";
            return 204;
        }
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers $cors_allow_headers always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Type" always;
        proxy_set_header Host 38.102.126.58;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass http://38.102.126.58:8882;
    }
}
