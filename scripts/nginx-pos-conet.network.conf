# pos.beamio.app — Beamio POS PWA (static SPA)
# Deploy:
#   scp scripts/nginx-pos-conet.network.conf conet.network:/tmp/
#   ssh conet.network 'sudo cp /tmp/nginx-pos-conet.network.conf /etc/nginx/sites-available/pos.beamio.app.conf && sudo ln -sf /etc/nginx/sites-available/pos.beamio.app.conf /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx'
# After first deploy, reissue TLS cert (api.settleonbase.xyz SAN) to include pos.beamio.app — see deployPosConetNetwork.sh

server {
    server_name pos.beamio.app;

    root /var/www/pos.conet.network;
    index index.html;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.settleonbase.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.settleonbase.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = pos.beamio.app) {
        return 301 https://$host$request_uri;
    }

    server_name pos.beamio.app;
    listen 80;
    return 404;
}

# Legacy WebView entry (CashTrees / older POS shells) — reverse-proxy to pos.beamio.app.
server {
    server_name pos.conet.network;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    location ^~ /.well-known/ {
        proxy_pass https://pos.beamio.app;
        proxy_set_header Host pos.beamio.app;
        proxy_ssl_server_name on;
        proxy_ssl_name pos.beamio.app;
    }

    location / {
        proxy_pass https://pos.beamio.app;
        proxy_set_header Host pos.beamio.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name pos.beamio.app;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.settleonbase.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.settleonbase.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = pos.conet.network) {
        return 301 https://$host$request_uri;
    }

    server_name pos.conet.network;
    listen 80;
    return 404;
}
