# publicrpc.conet.network -> local geth JSON-RPC (127.0.0.1:8888)
# WSS /ws -> conet-publicrpc-ws-bridge (127.0.0.1:8890) -> geth IPC (eth_subscribe)
# Host: 38.102.126.50
#
# Deploy (no geth restart):
#   rsync scripts/conet-publicrpc-ws-bridge + this file to host
#   cd ~/conet-publicrpc-ws-bridge && npm install
#   sudo cp conet-publicrpc-ws-bridge.service /etc/systemd/system/
#   sudo systemctl daemon-reload && sudo systemctl enable --now conet-publicrpc-ws-bridge
#   sudo cp nginx-publicrpc-conet.network.conf /etc/nginx/sites-available/publicrpc.conet.network.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name publicrpc.conet.network;

    # WebSocket JSON-RPC (same path convention as wss://base-rpc.conet.network/ws)
    location /ws {
        proxy_pass http://127.0.0.1:8890/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        if ($request_method = 'POST') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
        }
        if ($request_method = 'GET') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';
        }

        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8888;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/publicrpc.conet.network/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/publicrpc.conet.network/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = publicrpc.conet.network) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name publicrpc.conet.network;
    return 404; # managed by Certbot
}
