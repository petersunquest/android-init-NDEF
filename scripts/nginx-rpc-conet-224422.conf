# CoNET 224422 权威 RPC：rpc1.conet.network + rpc.conet.network -> Geth JSON-RPC :8888
# Deploy on 38.102.126.58:
#   append to /etc/nginx/sites-available/conet.conf (or replace rpc1-only block)
#   sudo nginx -t && sudo systemctl reload nginx
#
# rpc-old.conet.network -> :8882 见 scripts/nginx-rpc-old-conet.conf（只读归档，非写 RPC）

# rpc1.conet.network + rpc.conet.network -> Geth JSON-RPC :8888
# CORS: 任意 Web/App 来源（Allow-Origin *，不使用 credentials 以免与 * 冲突）
server {
    listen 80;
    listen [::]:80;
    server_name rpc1.conet.network rpc.conet.network;

    set $cors_allow_headers "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Api-Key,x-csrf-token,X-CSRF-Token,Accept,Accept-Language,Origin,Referer";

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers $cors_allow_headers always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain; charset=utf-8";
            return 204;
        }
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers $cors_allow_headers always;
        add_header Access-Control-Expose-Headers "Content-Length,Content-Type" always;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass http://38.102.126.58:8888;
    }
}
