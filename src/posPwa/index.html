<!doctype html>
<html class="light" lang="en" data-pos-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="color-scheme" content="light only" />
		<meta name="theme-color" content="#000414" />
		<meta name="supported-color-schemes" content="light" />
		<style>
			html {
				color-scheme: light only;
				background: #000414;
				height: 100%;
				height: 100dvh;
				overflow: hidden;
				overscroll-behavior: none;
			}
			body {
				margin: 0;
				background: #000414;
				color: #f5f5f7;
				-webkit-text-size-adjust: 100%;
				height: 100%;
				height: 100dvh;
				overflow: hidden;
				overscroll-behavior: none;
			}
			#root {
				height: 100%;
				height: 100dvh;
				max-height: 100dvh;
				overflow: hidden;
				overscroll-behavior: none;
				background: #000414;
			}
		</style>
		<title>Beamio POS</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<script>
			;(function () {
				var html = document.documentElement
				html.classList.remove('dark')
				html.classList.add('light')
				html.style.colorScheme = 'light only'
				html.dataset.posTheme = 'light'
			})()
		</script>
		<!-- Early kill any leftover Service Worker (no SW update path; Embedded OTA only). -->
		<script>
			;(function () {
				if (!('serviceWorker' in navigator)) return
				try {
					navigator.serviceWorker.getRegistrations().then(function (regs) {
						regs.forEach(function (reg) {
							try {
								reg.unregister()
							} catch (e) {}
						})
					})
				} catch (e) {}
				if (typeof caches !== 'undefined' && caches.keys) {
					try {
						caches.keys().then(function (keys) {
							keys.forEach(function (key) {
								try {
									caches.delete(key)
								} catch (e) {}
							})
						})
					} catch (e) {}
				}
			})()
		</script>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
